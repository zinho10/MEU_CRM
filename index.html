<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ERP ZINHO • Gestão Integrada</title><link rel="stylesheet" href="styles.css"></head>
<body>
<div class="app-shell">
<aside id="sidebar" class="sidebar">
  <div class="brand"><div class="brand-mark">Z</div><div><b>ERP ZINHO</b><small>Gestão Integrada</small></div></div>
  <button class="mobile-close" id="closeMenu">×</button>
  <div class="side-scroll">
    <button class="side-item active" data-mod="dashboard">📊 <span>Dashboard</span></button>
    <div class="side-group"><div class="side-title">CADASTROS</div>
      <button class="side-item" data-mod="produtos">📦 <span>Produtos / Estoque</span></button>
      <button class="side-item" data-mod="categorias">🏷️ <span>Categorias</span></button>
      <button class="side-item" data-mod="unidades">📏 <span>Unidades</span></button>
      <button class="side-item" data-mod="clientes">👥 <span>Clientes</span></button>
      <button class="side-item" data-mod="fornecedores">🏢 <span>Fornecedores</span></button>
      <button class="side-item" data-mod="funcionarios">🧑‍💼 <span>Funcionários</span></button>
    </div>
    <div class="side-group"><div class="side-title">OPERAÇÕES</div>
      <button class="side-item" data-mod="compras">🛒 <span>Compras</span></button>
      <button class="side-item" data-mod="vendas">💰 <span>Vendas</span></button>
      <button class="side-item" data-mod="movimentacoes">🔄 <span>Movimentações</span></button>
      <button class="side-item" data-mod="inventario">📋 <span>Inventário</span></button>
    </div>
    <div class="side-group"><div class="side-title">FINANCEIRO</div>
      <button class="side-item" data-mod="financeiro">💳 <span>Financeiro</span></button>
      <button class="side-item" data-mod="contasbancarias">🏦 <span>Contas / Caixa</span></button>
      <button class="side-item" data-mod="centroscustos">🎯 <span>Centros de custo</span></button>
      <button class="side-item" data-mod="formasPagamento">💵 <span>Formas de pagamento</span></button>
    </div>
    <div class="side-group"><div class="side-title">ADMINISTRAÇÃO</div>
      <button class="side-item" data-mod="relatorios">📑 <span>Relatórios</span></button>
      <button class="side-item" data-mod="usuarios">👤 <span>Usuários e permissões</span></button>
      <button class="side-item" data-mod="auditoria">🛡️ <span>Auditoria</span></button>
    </div>
    <div class="side-group"><div class="side-title">SISTEMA</div>
      <button class="side-item" data-mod="configuracoes">⚙️ <span>Configurações</span></button>
    </div>
  </div>
  <div class="side-footer">Banco local: <b>estoque.json</b><br><span id="syncState">● sincronizado</span></div>
</aside>
<div class="overlay" id="overlay"></div>
<section class="workspace">
<header class="topbar"><button id="openMenu" class="menu-toggle">☰</button><div><h1 id="pageTitle">Dashboard</h1><p id="pageSubtitle">Visão geral do seu ERP</p></div><div class="top-actions"><button class="btn secondary" id="btnBackup">⬇ Backup</button><span id="status"></span></div></header>
<main id="app"></main>
<footer>ERP ZINHO • ERP integrado • Estoque + Compras + Vendas + Financeiro + Inventário + Auditoria</footer>
</section></div>
<script src="app.js"></script>
</body></html>
